name: Production Deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VDS via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.VDS_SSH_KEY }}
          port: 22
          command_timeout: 90m
          script: |
            set -euo pipefail

            cd /root/teleganews

            # Сбрасываем локальные правки на сервере (иначе git pull падает и остаётся старый код)
            git fetch origin main
            git reset --hard origin/main

            export DOCKER_BUILDKIT=1
            export COMPOSE_PARALLEL_LIMIT=1

            # Место на диске: после неудачных сборок остаются слои Docker
            docker builder prune -f || true

            # pip-зависимости ставим один раз в base-образ (не параллельно в двух контейнерах)
            docker build -f Dockerfile.base -t teleganews-base:latest .

            # Пересборка только слоя с кодом, если requirements.txt не менялся — секунды
            docker compose build
            docker compose up -d

            docker image prune -f
